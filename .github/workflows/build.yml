name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew make

      - name: Upload .cs3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: '**/build/*.cs3'
          if-no-files-found: warn
