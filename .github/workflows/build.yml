name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@master
        with:
          ref: "builds"
          path: "builds"
        continue-on-error: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make

      - name: Create builds branch if missing
        run: |
          cd $GITHUB_WORKSPACE
          if [ ! -d builds/.git ]; then
            mkdir -p builds
            cd builds
            git init
            git checkout --orphan builds
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            touch .gitkeep
            git add .
            git commit -m "Init builds"
            git push -f origin builds
          fi

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE
          find src -name "*.cs3" -exec cp {} builds/ \;
          cd builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push -f origin HEAD:builds
